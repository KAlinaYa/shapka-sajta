<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="css/style.css" >
    <title>Shapka sajta</title>
  </head>
  <body>
    <header class="header">
      <a href="#" class="header__logo"
        ><img src="img/DevPath.svg" alt="Logo DevPath" width="100" height="29"
      ></a>
      <nav class="menu header__menu">
        <ul class="menu__list">
          <li class="menu__item"><a href="#" class="menu__link">Главная</a></li>
          <li class="menu__item"><a href="#" class="menu__link">Задания</a></li>
          <li class="menu__item"><a href="#" class="menu__link">Статьи</a></li>
          <li class="menu__item">
            <a href="#" class="menu__link">Прогресс</a>
          </li>
        </ul>
      </nav>
      <div class="actions">
        <button type="button" class="header__search">
            <span class="visually-hidden">Найти</span>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 21L16.66 16.66"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke="#0F172A"
            />
            <path
              d="M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke="#0F172A"
            />
          </svg>
        </button>
        <button type="button" class="header__btn">Начать обучение</button>
      </div>
    </header>
  </body>
</html>
